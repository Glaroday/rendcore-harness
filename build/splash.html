<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: dark; --splash-bg: #141416; --splash-fg: #f3f4f6; --splash-muted: #9ca0a8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: var(--splash-fg); background: var(--splash-bg); }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
      }
      html[data-platform="windows"] main { padding-top: 70px; }
      .markFrame { display: grid; place-items: center; }
      .mark { grid-area: 1 / 1; width: 196px; height: auto; }
      .title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
      .status { margin: -4px 0 0; color: var(--splash-muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="markFrame" aria-hidden="true">
        <img class="mark" src="dsh-loader-dark.gif" alt="" />
      </div>
      <h1 class="title" id="title">Starting RendCore Harness</h1>
      <p class="status" id="status">First launch may take a moment.</p>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('title').textContent = '正在启动 RendCore Harness'
        document.getElementById('status').textContent = '首次启动可能需要一点时间。'
      }
    </script>
  </body>
</html>
