# Built-in compatibility for muse-spark streams that close without a terminal
# finish event after already delivering content.
- insert:
    - id: model-fix
      name: dsh-model-fix
      config:
        modelPattern: '^muse-spark'
        providers: []

# Built-in ModSearch gives models without native browsing a web/search bridge.
# Its web UI exposes engine settings; the desktop seeds only the replaceable
# Grok CLI command and never stores an API key.
- id: web
  config:
    searchProvider: modsearch

- id: agent-default-model
  config:
    provider: rendcore
    model: gpt-5.6-sol
