# Keep the stock directory-picker (auto) row active: the native backend
# serves ctx.directoryPicker, so host-side consumers (host.pickDirectory,
# plugins reading the seam) work unmodified. The client surface keeps its
# Electron-dialog bridge via the client-ui patch in patches/.
- insert:
    # RendCore Harness owns the fixed-target dsh-market installer and its lightweight
    # settings entry. After dshmarket is installed and Harness restarts, the
    # community plugin replaces the placeholder with its complete market UI.
    - id: dsh-desktop-market-installer
      name: dsh-desktop-market-installer

# dsh-market normally offers to restart its own Node process after mutations.
# The desktop shell has the real lifecycle authority, so keep that behavior off
# whenever the optional plugin is present in the composed profile.
- id: dsh-market
  config:
    profile: web
    allowRestart: false

# RendCore ships one OpenAI-compatible gateway so the first session is ready
# without a provider setup flow. User settings still override this composition
# layer and can add or replace routes from the Models page.
- id: llm-pi-ai
  config:
    providers:
      rendcore:
        displayName: RendCore
        apiKeyEnv: RENDCORE_API_KEY
        api: openai-completions
        baseURL: http://47.103.24.134:18036/v1
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
          maxTokensField: max_tokens
        defaultContextWindow: 1050000
        defaultMaxTokens: 128000
        defaultInput:
          - text
        models:
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
            contextWindow: 1050000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts: {low: low, medium: medium, high: high, xhigh: xhigh, max: max}
          - id: gpt-5.6-luna
